[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-1-sdk"
version = "0.2.3"
description = "A circuit breaker and runtime protection SDK for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "circuit-breaker", "runtime-protection", "safety"]
authors = [
    { name = "AgentShield Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/SnapNutri/agentshield-sdk"
Repository = "https://github.com/SnapNutri/agentshield-sdk"
Issues = "https://github.com/SnapNutri/agentshield-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
