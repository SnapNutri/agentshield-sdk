name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: |
          python -m pip install ruff
          python -m ruff check src tests

      - name: Compile source and tests
        run: python -m compileall -q src tests

  package:
    name: Build and clean-install package
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build --outdir dist

      - name: Check wheel contents
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any(name.startswith("tests/") for name in names)
          assert not any(".venv" in name or "Users/" in name for name in names)
          print(f"Verified {wheel.name}: {len(names)} files")
          PY

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentshield-clean"
          "$RUNNER_TEMP/agentshield-clean/bin/python" -m pip install --no-deps dist/*.whl

      - name: Smoke test clean installation
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentshield-clean/bin/python" - <<'PY'
          import asyncio
          import pathlib
          import sys

          import agentshield
          from agentshield import current_shield, shield

          assert pathlib.Path(agentshield.__file__).resolve().is_relative_to(
              pathlib.Path(sys.prefix).resolve()
          )

          @shield(max_duration_seconds=None)
          def sync_agent():
              return current_shield().record_step()

          @shield(max_duration_seconds=None)
          async def async_agent():
              await asyncio.sleep(0)
              return current_shield().record_step()

          assert sync_agent() == 1
          assert asyncio.run(async_agent()) == 1
          print("Clean-install smoke test passed")
          PY
