name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile source and tests
        run: python -m compileall -q src tests

  package:
    name: Build and clean-install package
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build --outdir dist

      - name: Check wheel contents
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert not any(name.startswith("tests/") for name in names)
          assert not any(".venv" in name or "Users/" in name for name in names)
          print(f"Verified {wheel.name}: {len(names)} files")
          PY

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentshield-clean"
          "$RUNNER_TEMP/agentshield-clean/bin/python" -m pip install --no-deps dist/*.whl

      - name: Verify installed public API and execution
        run: |
          mkdir -p "$RUNNER_TEMP/agentshield-smoke"
          cd "$RUNNER_TEMP/agentshield-smoke"
          "$RUNNER_TEMP/agentshield-clean/bin/python" - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          import agentshield
          from agentshield import (
              AgentSession,
              AgentShieldError,
              AgentShieldEvent,
              BudgetExceededError,
              DurationLimitExceededError,
              EventSink,
              InMemoryEventSink,
              LoopDetectedError,
              ModelPricing,
              ProtectionDecision,
              SessionStatus,
              ShieldConfig,
              StagnationDetectedError,
              StepLimitExceededError,
              ToolRepetitionError,
              calculate_token_cost,
              current_shield,
              shield,
          )

          clean_environment = Path(os.environ["RUNNER_TEMP"]) / "agentshield-clean"
          assert Path(agentshield.__file__).resolve().is_relative_to(
              clean_environment.resolve()
          )
          assert calculate_token_cost(
              model="gpt-4o-mini", input_tokens=1_000, output_tokens=500
          ) > 0

          sink = InMemoryEventSink()

          @shield(max_duration_seconds=None, event_sink=sink)
          def sync_agent():
              current_shield().record_step()
              return "sync-ok"

          @shield(max_duration_seconds=None, event_sink=sink)
          async def async_agent():
              await asyncio.sleep(0)
              current_shield().record_step()
              return "async-ok"

          assert sync_agent() == "sync-ok"
          assert asyncio.run(async_agent()) == "async-ok"
          assert len(sink.events) == 6

          class BrokenSink:
              def emit(self, event):
                  raise RuntimeError("telemetry unavailable")

          @shield(
              budget_limit=1.0,
              max_duration_seconds=None,
              event_sink=BrokenSink(),
          )
          def protected_agent():
              control = current_shield()
              control.record_llm_call(
                model="gpt-4o-mini",
                input_tokens=2_000_000,
                output_tokens=2_000_000,
                latency_ms=10,
              )
              control.check_before_step()

          try:
              protected_agent()
          except BudgetExceededError:
              pass
          else:
              raise AssertionError("budget protection was bypassed")
          print("Clean-install public API, sync, async, and telemetry checks passed")
          PY
