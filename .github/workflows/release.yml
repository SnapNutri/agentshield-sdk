name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Build distributions
        run: python -m build --outdir dist

      - name: Verify distributions
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any(name.startswith("tests/") for name in names)
          assert not any(".venv" in name or "Users/" in name for name in names)
          print(f"Verified {wheel.name}: {len(names)} files")
          PY

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentshield-clean"
          "$RUNNER_TEMP/agentshield-clean/bin/python" -m pip install --no-deps dist/*.whl

      - name: Smoke test clean installation
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentshield-clean/bin/python" - <<'PY'
          import asyncio
          import sys
          from pathlib import Path

          import agentshield
          from agentshield import BudgetExceededError, current_shield, shield

          assert Path(agentshield.__file__).resolve().is_relative_to(
              Path(sys.prefix).resolve()
          )

          @shield(max_duration_seconds=None)
          def sync_agent():
              current_shield().check_before_step()
              return current_shield().record_step()

          @shield(max_duration_seconds=None)
          async def async_agent():
              await asyncio.sleep(0)
              current_shield().check_before_step()
              return current_shield().record_step()

          assert sync_agent() == 1
          assert asyncio.run(async_agent()) == 1

          @shield(budget_limit=1.0, max_duration_seconds=None)
          def budget_agent():
              control = current_shield()
              control.record_llm_call(
                  model="gpt-4o-mini",
                  input_tokens=2_000_000,
                  output_tokens=2_000_000,
                  latency_ms=10,
              )
              control.check_before_step()

          try:
              budget_agent()
          except BudgetExceededError:
              pass
          else:
              raise AssertionError("budget protection was bypassed")
          print("Clean-install smoke test passed")
          PY

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
